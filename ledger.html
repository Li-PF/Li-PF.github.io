<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日利润计算器</title>
<style>
:root {
  --bg:#F5F6F8; --card:#fff; --text:#1F2329; --text2:#646A73; --text3:#8F959E;
  --border:#E5E8EC; --primary:#272E3B; --profit:#2BA471; --loss:#E34D59;
  --radius:12px; --shadow:0 1px 6px rgba(0,0,0,0.05);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button,input{cursor:pointer;font-family:inherit;outline:none;border:none}
input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:0.88rem;width:100%}
input:focus{border-color:var(--primary);background:#fff}

/* 头部 */
.header{background:var(--primary);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.2rem;font-weight:700}

/* 主容器 */
.main{max-width:960px;margin:0 auto;padding:16px 16px 80px}

/* 顶部控制栏 */
.top-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.top-bar label{font-size:0.82rem;font-weight:600;color:var(--text2);white-space:nowrap}
.top-bar input[type="month"]{width:auto;min-width:130px}
.top-bar .rent-input{width:120px}

/* 摘要卡片 */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.summary-card{
  background:var(--card);border-radius:var(--radius);padding:16px 20px;
  box-shadow:var(--shadow);transition:0.2s
}
.summary-card:hover{transform:translateY(-1px);box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.summary-card .slabel{font-size:0.78rem;color:var(--text2);margin-bottom:4px}
.summary-card .sval{font-size:1.6rem;font-weight:700;letter-spacing:-0.5px}
.summary-card.profit .sval{color:var(--profit)}
.summary-card.loss .sval{color:var(--loss)}

/* 表格 */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
thead{background:#FAFBFC}
th{padding:12px 14px;text-align:left;font-weight:600;font-size:0.8rem;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
td input{padding:6px 10px;font-size:0.86rem;text-align:right}
td input.date-input{text-align:left}
td input.note-input{text-align:left}
.col-profit{font-weight:700;font-size:0.95rem}
.profit-positive{color:var(--profit)}
.profit-negative{color:var(--loss)}
.btn-del{background:none;color:var(--text3);font-size:0.9rem;padding:4px 8px;border-radius:6px;transition:0.15s}
.btn-del:hover{color:var(--loss);background:#FDECEE}

/* 合计行 */
tfoot td{font-weight:700;font-size:0.92rem;background:#FAFBFC;border-top:2px solid var(--border)}
tfoot .profit-positive{font-size:0.92rem;font-weight:700}

/* 添加按钮 */
.btn-add-row{
  margin-top:12px;padding:10px 20px;background:var(--primary);color:#fff;
  border-radius:8px;font-size:0.86rem;font-weight:600;transition:0.2s;
  box-shadow:0 1px 4px rgba(39,46,59,0.2)
}
.btn-add-row:hover{background:#3A4352;transform:translateY(-1px)}

/* 空状态 */
.empty{margin-top:12px;text-align:center;padding:40px;color:var(--text3);font-size:0.9rem}

/* 提示 */
.tip{font-size:0.78rem;color:var(--text3);margin-top:8px}

/* 响应式 */
@media(max-width:700px){
  .summary-row{grid-template-columns:repeat(2,1fr)}
  .summary-card .sval{font-size:1.3rem}
  .table-wrap{overflow-x:auto}
  table{font-size:0.82rem;min-width:650px}
  th,td{padding:8px 10px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1>📊 日利润计算器</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label style="color:rgba(255,255,255,0.7);font-size:0.8rem">月份</label>
      <input type="month" id="monthSelect" style="width:auto;min-width:130px;font-size:0.84rem">
    </div>
  </div>
</header>

<main class="main">
  <!-- 房租 -->
  <div class="top-bar">
    <label>🏠 本月房租</label>
    <input type="number" id="rentInput" class="rent-input" placeholder="0" step="0.01" min="0">
    <span style="font-size:0.8rem;color:var(--text3)">填写后在月利润中自动扣除</span>
  </div>

  <!-- 摘要 -->
  <div class="summary-row">
    <div class="summary-card">
      <div class="slabel">📈 月营业额</div>
      <div class="sval" id="sumRevenue">¥0</div>
    </div>
    <div class="summary-card">
      <div class="slabel">📉 月总成本</div>
      <div class="sval" id="sumCost">¥0</div>
    </div>
    <div class="summary-card">
      <div class="slabel">💡 月毛利润</div>
      <div class="sval" id="sumDaily">¥0</div>
    </div>
    <div class="summary-card profit" id="netCard">
      <div class="slabel">💰 月净利润</div>
      <div class="sval" id="sumNet">¥0</div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:130px">日期</th>
          <th>营业额</th>
          <th>推广费</th>
          <th>买菜钱</th>
          <th>天利润</th>
          <th style="width:120px">备注</th>
          <th style="width:40px"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
  <button class="btn-add-row" onclick="addRow()">＋ 添加一天</button>
  <p class="tip">💡 所有数据自动保存在浏览器本地，关闭页面不丢失。切换月份查看不同数据。</p>
</main>

<script>
// ==================== 数据 ====================
const STORAGE_KEY = 'daily_profit_data';
// 结构: { "2026-08": { rent: 5000, days: [{id,date,revenue,marketing,ingredients,note}] } }

function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveAll(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function getMonthData(month) {
  const all = loadAll();
  if (!all[month]) all[month] = { rent: 0, days: [] };
  return all[month];
}
function saveMonthData(month, md) {
  const all = loadAll();
  all[month] = md;
  saveAll(all);
}

let currentMonth = '';
let monthData = null;

// ==================== 初始化 ====================
const monthSelect = document.getElementById('monthSelect');
const rentInputEl = document.getElementById('rentInput');

function init() {
  const now = new Date();
  currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  monthSelect.value = currentMonth;
  loadMonth();
}

function loadMonth() {
  currentMonth = monthSelect.value;
  monthData = getMonthData(currentMonth);
  rentInputEl.value = monthData.rent || 0;
  renderTable();
  renderSummary();
}

monthSelect.addEventListener('change', loadMonth);
rentInputEl.addEventListener('input', () => {
  monthData.rent = parseFloat(rentInputEl.value) || 0;
  saveMonthData(currentMonth, monthData);
  renderSummary();
});

// ==================== 计算 ====================
function dailyProfit(row) {
  return (row.revenue || 0) - (row.marketing || 0) - (row.ingredients || 0);
}

function calcSummary() {
  let totalRevenue = 0, totalMarketing = 0, totalIngredients = 0;
  monthData.days.forEach(d => {
    totalRevenue += d.revenue || 0;
    totalMarketing += d.marketing || 0;
    totalIngredients += d.ingredients || 0;
  });
  const totalDailyProfit = totalRevenue - totalMarketing - totalIngredients;
  const rent = monthData.rent || 0;
  const netProfit = totalDailyProfit - rent;
  return { totalRevenue, totalMarketing, totalIngredients, totalCost: totalMarketing + totalIngredients, totalDailyProfit, rent, netProfit };
}

// ==================== 渲染 ====================
function renderTable() {
  const tbody = document.getElementById('tableBody');
  const days = monthData.days;

  if (days.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">暂无记录，点击下方「添加一天」开始记录</td></tr>`;
    document.getElementById('tableFoot').innerHTML = '';
    return;
  }

  // 按日期排序
  days.sort((a,b) => a.date.localeCompare(b.date));

  tbody.innerHTML = days.map((d, i) => {
    const profit = dailyProfit(d);
    const cls = profit >= 0 ? 'profit-positive' : 'profit-negative';
    return `
      <tr data-idx="${i}">
        <td><input type="date" class="date-input" value="${d.date}" onchange="updateField(${i},'date',this.value)"></td>
        <td><input type="number" value="${d.revenue||0}" step="0.01" min="0" onchange="updateField(${i},'revenue',+this.value)"></td>
        <td><input type="number" value="${d.marketing||0}" step="0.01" min="0" onchange="updateField(${i},'marketing',+this.value)"></td>
        <td><input type="number" value="${d.ingredients||0}" step="0.01" min="0" onchange="updateField(${i},'ingredients',+this.value)"></td>
        <td class="col-profit ${cls}">¥${profit.toFixed(2)}</td>
        <td><input type="text" class="note-input" value="${escapeHtml(d.note||'')}" placeholder="-" onchange="updateField(${i},'note',this.value)"></td>
        <td><button class="btn-del" onclick="delRow(${i})" title="删除">✕</button></td>
      </tr>`;
  }).join('');

  // 合计行
  const s = calcSummary();
  document.getElementById('tableFoot').innerHTML = `
    <tr>
      <td>合计</td>
      <td>¥${s.totalRevenue.toFixed(2)}</td>
      <td>¥${s.totalMarketing.toFixed(2)}</td>
      <td>¥${s.totalIngredients.toFixed(2)}</td>
      <td class="col-profit ${s.totalDailyProfit>=0?'profit-positive':'profit-negative'}">¥${s.totalDailyProfit.toFixed(2)}</td>
      <td></td>
      <td></td>
    </tr>`;
}

function renderSummary() {
  const s = calcSummary();
  document.getElementById('sumRevenue').textContent = '¥' + s.totalRevenue.toFixed(2);
  document.getElementById('sumCost').textContent = '¥' + (s.totalCost).toFixed(2);
  document.getElementById('sumDaily').textContent = '¥' + s.totalDailyProfit.toFixed(2);

  const netEl = document.getElementById('sumNet');
  netEl.textContent = '¥' + s.netProfit.toFixed(2);
  const netCard = document.getElementById('netCard');
  netCard.classList.toggle('profit', s.netProfit >= 0);
  netCard.classList.toggle('loss', s.netProfit < 0);
}

// ==================== 操作 ====================
function updateField(idx, field, value) {
  monthData.days[idx][field] = value;
  saveMonthData(currentMonth, monthData);
  renderTable();
  renderSummary();
}

function addRow() {
  const today = new Date().toISOString().slice(0,10);
  monthData.days.push({ id: Date.now().toString(36), date: today, revenue: 0, marketing: 0, ingredients: 0, note: '' });
  saveMonthData(currentMonth, monthData);
  renderTable();
  renderSummary();
}

function delRow(idx) {
  monthData.days.splice(idx, 1);
  saveMonthData(currentMonth, monthData);
  renderTable();
  renderSummary();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 启动 ====================
init();
</script>
</body>
</html>
