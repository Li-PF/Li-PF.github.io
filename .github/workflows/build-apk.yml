name: 打包 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
          # The zip contains a 'cmdline-tools' directory inside
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          else
            mkdir -p $ANDROID_HOME/cmdline-tools/latest
            mv $ANDROID_HOME/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK setup done. Installed packages:"
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/dayprofit/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          cp icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DayProfit"
          include(":app")
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle << 'EOF'
          plugins { id("com.android.application") version "8.2.0" apply false }
          repositories { google(); mavenCentral() }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace "com.dayprofit.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.dayprofit.app"
                  minSdk 21; targetSdk 34
                  versionCode 1; versionName "1.0"
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("release.keystore")
                      storePassword "android123"
                      keyAlias "dayprofit"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="日利润"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dayprofit/app/MainActivity.java << 'EOF'
          package com.dayprofit.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  w.setStatusBarColor(0xFF0F172A);
                  WebView v = new WebView(this);
                  setContentView(v);
                  WebSettings s = v.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  v.setWebViewClient(new WebViewClient());
                  v.loadUrl("https://li-pf.github.io/ledger.html");
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          EOF

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias dayprofit \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=DP" \
            -noprompt

      - name: Diagnostic
        run: |
          echo "=== Java ===" && java -version
          echo "=== ANDROID_HOME ===" && echo $ANDROID_HOME
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
          echo "=== Gradle ===" && ./gradlew -v
          echo "=== Dependencies ===" && ./gradlew :app:dependencies --console=plain 2>&1 | tail -50 || true

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 日利润计算器-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
