name: 打包 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Use pre-installed Android SDK
        run: |
          # GitHub 的 ubuntu-latest 自带 Android SDK
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "SDK at $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms/" || echo "no platforms dir"
          ls "$ANDROID_SDK_ROOT/build-tools/" || echo "no build-tools dir"
          # 安装需要的 SDK 组件
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/dayprofit/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          cp icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png

          # gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2g' > gradle.properties

          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { gradlePluginPortal(); google(); mavenCentral() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DayProfit"
          include(":app")
          EOF

          # root build.gradle
          cat > build.gradle << 'EOF'
          plugins { id("com.android.application") version "8.1.4" apply false }
          EOF

          # app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace "com.dayprofit.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.dayprofit.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              lint { checkReleaseBuilds false; abortOnError false }
              signingConfigs {
                  release {
                      storeFile rootProject.file("release.keystore")
                      storePassword "android123"
                      keyAlias "dayprofit"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="日利润"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat > app/src/main/java/com/dayprofit/app/MainActivity.java << 'EOF'
          package com.dayprofit.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  w.setStatusBarColor(0xFF0F172A);
                  WebView v = new WebView(this);
                  setContentView(v);
                  WebSettings s = v.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  v.setWebViewClient(new WebViewClient());
                  v.loadUrl("https://li-pf.github.io/ledger.html");
              }
          }
          EOF

          # styles.xml
          echo '<resources><style name="AppTheme" parent="android:Theme.Material.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias dayprofit \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=DP" \
            -noprompt

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 日利润计算器-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
